########################################################
###########GTlab Pipeline Version 2.0.0 ###########
########################################################
# This is a slight changed version and 
# --> the nightly copy stage is currently missing
# --> contains a guiTests step
# --> executes copyBin.bat in copyForDeploymentWin and
#     copyForDeploymentLinux

# Environment variables to use in the pipeline globally
variables:
  PIPELINEVERSION: "2.0.0-unstable"
  GIT_SUBMODULE_STRATEGY: "recursive"
  GIT_STRATEGY: "clone"
  
  # overriding the global config for now in this branch
  QT_DIR_LINUX:  "/opt/Qt/5.15.2/gcc_64/"
  QT_DIR_LINUX2: "/opt/Qt/5.15.2/gcc_64/"

# inlcude some templates from this file
include:
  - project: 'gtlab/public/development-tools/gitlab-templates'
    file: '/ci-templates/.ci-templates-cmake-1.0.yml'

   
stages:
  - update
  - build
  - test
  - package
  - guiTestStable
  - guiTestUnstable
  - regressionTest
  - copy
  - codequality
  - badges

# Templates
.debugBuildRules:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: never
    - if: $CI_COMMIT_TAG == null
    - if: $CI_COMMIT_TAG =~ /^[1-9][0-9]*-[0-9]+-[0-9]+$/ # stable tag
    - if: $CI_COMMIT_TAG =~ /^[1-9][0-9]*-[0-9]+-[0-9]+-.*$/ # unstable tag

.releaseBuildRules:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: never
    - if: $CI_COMMIT_BRANCH == "master" # -master
    - if: $CI_COMMIT_TAG =~ /^[1-9][0-9]*-[0-9]+-[0-9]+$/ # stable tag
    - if: $CI_COMMIT_TAG =~ /^[1-9][0-9]*-[0-9]+-[0-9]+-.*$/ # unstable tag

.winartifacts:
  artifacts:
    paths:
      - install*
      - build/**/*.dll
      - build/**/*.exe
      - build/**/*.lib
      - build/**/*.pdb
      - build/modules
      - build/**/*.txt
      - build/**/*.cmake
      - build/**/*.ninja
      - build/**/*.log
      - build/_deps/*-src

# build on Windows system
windowsBuildDebug:
  stage: build
  extends: 
    - .build-win_21
    - .debugBuildRules
    - .winartifacts
  script:
    - $env:PATH+=(";.\build;"+$env:GTLAB_DEV_TOOLS+"\binDebug;"+$env:GTLAB_DEV_TOOLS+"\binDebug\modules;")
    - cmake -B build -S . -G "Ninja" -DCMAKE_BUILD_TYPE=Debug -DGTlabDevtools_ROOT="$env:GTLAB_DEV_TOOLS" -DCMAKE_INSTALL_PREFIX=install-msvc2026-dbg -DBUILD_UNITTESTS=ON -DBUILD_TESTMODULES=ON
    - cmake --build build --target install


windowsBuildRelease:
  stage: build
  extends: 
    - .build-win_21
    - .releaseBuildRules
  script:
    - cmake -B build -S . -G "Ninja" -DCMAKE_BUILD_TYPE=Release -DGTlabDevtools_ROOT="$env:GTLAB_DEV_TOOLS" -DCMAKE_INSTALL_PREFIX=install-msvc2026
    - cmake --build build --target install
  artifacts:
    paths:
      - install*


.linuxartifacts:
  artifacts:
    paths:
      - install*
      - build/*.so*
      - build/GTlab*
      - build/modules
      - build/**/*.txt
      - build/**/*.cmake
      - build/**/*.ninja
      - build/**/*.log
      - build/**/*.cpp
      - build/_deps/*-src
      - build/compile_commands.json

# Linux build
linuxBuildDebug_2.0:
  stage: build
  extends: 
    - .build-linux_20
    - .debugBuildRules
    - .linuxartifacts
  script:
    - cmake -B build -S . -G "Ninja" -DCMAKE_BUILD_TYPE=Debug -DGTlabDevtools_ROOT=$GTLAB_DEV_TOOLS -DCMAKE_INSTALL_PREFIX=install-linux-dbg -DBUILD_UNITTESTS=ON -DBUILD_WITH_COVERAGE=ON -DBUILD_TESTMODULES=ON -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
    - cmake --build build --target install

linuxBuildDebug:
  stage: build
  extends: 
    - .build-linux_21
    - .debugBuildRules
    - .linuxartifacts
  script:
    - cmake -B build -S . -G "Ninja" -DCMAKE_BUILD_TYPE=Debug -DGTlabDevtools_ROOT=$GTLAB_DEV_TOOLS -DCMAKE_INSTALL_PREFIX=install-linux-dbg -DBUILD_UNITTESTS=ON -DBUILD_WITH_COVERAGE=ON -DBUILD_TESTMODULES=ON -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
    - cmake --build build --target install

linuxBuildRelease:
  stage: build
  extends: 
    - .build-linux_21
    - .releaseBuildRules
  script:
    - cmake -B build -S . -G "Ninja" -DCMAKE_BUILD_TYPE=Release -DGTlabDevtools_ROOT=$GTLAB_DEV_TOOLS -DCMAKE_INSTALL_PREFIX=install-linux
    - cmake --build build --target install
  artifacts:
    paths:
      - install*

# Template for the two GUI-Testing jobs
.guiTestTemplate:
  before_script:
    # sync submodules
    - git submodule sync
    - git submodule update --init
    # add permissions
    - chmod +x ./tests/guitests/run_guitests.sh
  script:
    # xvfb to run a virtual display
    - xvfb-run -a ./tests/guitests/run_guitests.sh
  retry: 1
  artifacts:
    paths:
      - ./gui_tests_web
      - ./gui_tests_junits
      - ./gui_tests_stdout*.txt     
      - ./gui_tests_server_stdout.txt  
      - ./guitests_badge.svg
    reports:
      junit: ./gui_tests_junits/junit*.xml
    name: "guitesting results"
    expire_in: 1 week
    when: always

# GUI Testing Unstable
guiTests:
  stage: guiTestUnstable
  extends: .guiTestTemplate
  tags:
    - Linux
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: never
    - if: $CI_COMMIT_TAG == null
  needs:
      - linuxBuildDebug_2.0
      - job: "testLinux_2.0"
        artifacts: false
  dependencies:
    - linuxBuildDebug_2.0
  variables:
    DEVTOOLS_DIR: $DEVTOOLS_Linux_Unstable      

# todo, make only one require
guiTestsTag:
  stage: guiTestUnstable
  extends: .guiTestTemplate
  tags:
    - Linux
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: never
    - if: $CI_COMMIT_TAG =~ /^[1-9][0-9]*-[0-9]+-[0-9]+-.*$/ # unstable tag
  needs:
      - linuxBuildDebug_2.0
      - job: "testLinux_2.0"
        artifacts: false
  dependencies:
    - linuxBuildDebug_2.0
  variables:
    DEVTOOLS_DIR: $DEVTOOLS_Linux_Unstable

.testartifacts:
  artifacts:
    paths:
      - "build/unittests.xml"
    expire_in: 1 week
    reports:
      junit: build/unittests.xml

# run tests using the binary built before
testWin:
  stage: test
  needs: ["windowsBuildDebug"]
  extends: 
    - .debugBuildRules
    - .windocker_2.1
    - .testartifacts
  before_script:
   - !reference [.update_devtools_win, script]
  script:
    - $env:path = "$env:GTLAB_DEV_TOOLS\binDebug;$env:QT_INSTALL_PATH\bin;$env:path"
    - cd build
    - .\GTlabUnitTest.exe --gtest_output=xml:unittests.xml

testLinux_2.0:
  stage: test
  needs: ["linuxBuildDebug_2.0"]
  extends: 
    - .debugBuildRules
    - .linuxdocker
    - .testartifacts
  before_script:
    - !reference [.update_devtools_linux, script]
  script:
    - cd build
    - ./GTlabUnitTest --gtest_output=xml:unittests.xml
  variables:
    GIT_SUBMODULE_STRATEGY: "none"

testLinux:
  stage: test
  needs: ["linuxBuildDebug"]
  extends: 
    - .debugBuildRules
    - .linuxdocker_2.1
    - .testartifacts
  before_script:
    - !reference [.update_devtools_linux, script]
  script:
    - cd build
    - ./GTlabUnitTest --gtest_output=xml:unittests.xml
  variables:
    GIT_SUBMODULE_STRATEGY: "none"


code-coverage:
  stage: codequality
  extends: 
    - .linuxdocker_2.1
    - .debugBuildRules
  needs: 
    - linuxBuildDebug
  before_script:
    - !reference [.update_devtools_linux, script]
  script:
    - cd build
    - ninja test-coverage
    - mv test-coverage ..
  coverage: '/^\s{2}lines\.+:\s+(\d+.\d+\%)/'
  variables:
    GIT_SUBMODULE_STRATEGY: "none"
  artifacts:
    expose_as: 'TestCoverage'
    name: "TestCoverage-$CI_COMMIT_REF_NAME"
    paths:
      - "test-coverage"

valgrind:
  extends: 
    - .debugBuildRules
    - .linuxdocker_2.1
  needs: ["linuxBuildDebug"]
  stage: test
  before_script:
    - apt update -y && apt install -y xvfb xauth
    - !reference [.update_devtools_linux, script]
    - chmod +x ./tests/memcheck/runValgrind.sh
    - chmod +x ./tests/memcheck/post.py
    - python3 -m venv env
    - source env/bin/activate
    - pip3 install valgrind-codequality
  script:
    - export DEVTOOLS=$GTLAB_DEV_TOOLS
    - export GTLAB_LIBRARY_DIR=`pwd`/build
    - xvfb-run -a ./tests/memcheck/runValgrind.sh
    # Convert to codequality format
    - valgrind-codequality --input-file valgrind-report.xml --output-file valgrind.json
  artifacts:
    when: always
    paths:
      - valgrind-report.xml
    reports:
      codequality: valgrind.json
    expire_in: 1 week
  variables:
    GIT_SUBMODULE_STRATEGY: "none"


# copy templates
.copyTemplate:
  script:
    - .\tests\build\copyHeaders-deployment.bat
    - .\tests\build\copyBin.bat
  tags:
    - Win10

.tagTemplate:
  extends: .copyTemplate
  rules:
    - if: $CI_COMMIT_TAG =~ /^[1-9][0-9]*-[0-9]+-[0-9]+.*$/
  variables:
    RELEASESTATUS: unstable

.package:
  stage: package
  tags: ["docker", "linux"]
  extends: [".releaseBuildRules"]
  image: debian:buster
  script:
    - cp -r install-$toolchain-dbg/* install-$toolchain
    - mv install-$toolchain gtlab-core-$toolchain
    - tar czf gtlab-core-$toolchain.tar.gz gtlab-core-$toolchain
  artifacts:
    name: "gtlab-core-$toolchain"
    paths: ["gtlab-core-$toolchain.tar.gz"]
  variables:
    toolchain: msvc2019
    GIT_STRATEGY: "none"

package-win_2.1:
  extends: [".package"]
  needs: ["windowsBuildRelease", "windowsBuildDebug"]
  variables:
    toolchain: msvc2026

package-linux_2.1:
  extends: [".package"]
  needs: ["linuxBuildRelease", "linuxBuildDebug"]
  variables:
    toolchain: linux

# code quality
.codingstyle:
  stage: codequality
  extends: .codingStyleTemplate 
  except:
    - tags

cppcheck:
  stage: codequality
  extends:
    - .linuxdocker_2.1
  allow_failure: false
  needs: ["linuxBuildDebug"]
  script:
  - cmake -S . -B build -DBUILD_UNITTESTS=OFF -DBUILD_TESTMODULES=OFF
  # Cppcheck 2.21 ignores these DevTools -isystem entries.
  # Retain the CMake-generated database and make them normal includes for analysis.
  - sed -e "s|-isystem ${GTLAB_DEV_TOOLS}/include/logging|-I${GTLAB_DEV_TOOLS}/include/logging|g" -e "s|-isystem ${GTLAB_DEV_TOOLS}/include/h5|-I${GTLAB_DEV_TOOLS}/include/h5|g" build/compile_commands.json > build/cppcheck_compile_commands.json
  - cppcheck --inline-suppr --xml --std=c++14 --disable=unusedFunction --suppressions-list=cppcheck.suppress --suppressions-list=cppcheck-baseline.suppress --library=qt.cfg --error-exitcode=255 --enable=all -j 16 -i build --project=build/cppcheck_compile_commands.json 2> cppcheck_out.xml || exit_code=$?
  - more cppcheck_out.xml
  - cppcheck-codequality --input-file=cppcheck_out.xml --output-file=codequality.json
  - exit $exit_code
  variables:
    GIT_SUBMODULE_STRATEGY: "none"
  artifacts:
    reports:
      codequality: codequality.json
    paths:
      - codequality.json

   
check-license:
   stage: codequality
   tags: ["docker", "linux"]
   needs: []
   image: at-twk-hal9000.intra.dlr.de:5000/dlr-at/buster-dev
   before_script:
    - python3 -m pip install reuse
   script:
    - reuse lint
   variables:
     GIT_SUBMODULE_STRATEGY: "none"

# badges
badges:
  stage: badges
  extends: .badgeTemplate 
  except:
    - tags
  dependencies: ["windowsBuildDebug", "linuxBuildDebug"]
    
