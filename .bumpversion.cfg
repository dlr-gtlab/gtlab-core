[bumpversion]
current_version = 2.1.0-dev
commit = True
tag = True
tag_name = v{new_version}
parse = (?P<major>\d+)\.(?P<minor>\d+)\.(?P<patch>\d+)(?:-(?P<stage>dev|alpha|beta|rc)(?:\.(?P<serial>\d+))?)?
serialize =
    {major}.{minor}.{patch}-{stage}.{serial}
    {major}.{minor}.{patch}-{stage}
    {major}.{minor}.{patch}

# Keep stable versions without a suffix. The serial resets to 0 when moving
# to a new stage, so the first numbered prerelease uses --new-version:
#   bump2version --new-version 2.1.0-alpha.1 stage
#   bump2version serial                         # alpha.1 -> alpha.2
#   bump2version --new-version 2.1.0-beta.1 stage
#   bump2version --new-version 2.1.0-rc.1 stage
#   bump2version stage                          # rc.N -> 2.1.0
# Update CHANGELOG.md only when publishing the final 2.1.0 release.
[bumpversion:part:stage]
values =
    dev
    alpha
    beta
    rc
    stable
optional_value = stable

[bumpversion:part:serial]
first_value = 0

[bumpversion:file:conanfile.py]
search = version = "{current_version}"
replace = version = "{new_version}"

[bumpversion:file:CMakeLists.txt]
# CMake project(VERSION) accepts numeric components only.
search = project(GTlab-Core VERSION {current_major}.{current_minor}.{current_patch})
replace = project(GTlab-Core VERSION {new_major}.{new_minor}.{new_patch})

[bumpversion:file:docs/dev/conf.py]
search = release = "{current_version}"
replace = release = "{new_version}"

[bumpversion:file:docs/user/conf.py]
search = release = "{current_version}"
replace = release = "{new_version}"

[bumpversion:file:src/dataprocessor/gt_version.h]
search = #define GT_VERSION_STRING "{current_version}"
replace = #define GT_VERSION_STRING "{new_version}"

[bumpversion:file (numeric version):src/dataprocessor/gt_version.h]
search = #define GT_VERSION_MAJOR {current_major}
    #define GT_VERSION_MINOR {current_minor}
    #define GT_VERSION_PATCH {current_patch}
replace = #define GT_VERSION_MAJOR {new_major}
    #define GT_VERSION_MINOR {new_minor}
    #define GT_VERSION_PATCH {new_patch}
