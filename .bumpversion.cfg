[bumpversion]
current_version = 2.1.0-dev
commit = True
tag = True
tag_name = v{new_version}
parse = (?P<major>\d+)\.(?P<minor>\d+)\.(?P<patch>\d+)(?:-(?P<stage>dev|alpha|beta|rc)(?:\.(?P<serial>\d+))?(?:\.(?P<development>dev))?)?
serialize =
    {major}.{minor}.{patch}-{stage}.{serial}.{development}
    {major}.{minor}.{patch}-{stage}.{serial}
    {major}.{minor}.{patch}-{stage}
    {major}.{minor}.{patch}

# Following a prerelease, change master to a later untagged dev version:
#   bump2version --no-tag development           # alpha.1 -> alpha.1.dev
#   bump2version serial                         # alpha.1.dev -> alpha.2
# Following a stable release, bump to the NEXT patch's dev version:
#   bump2version --no-tag --new-version 2.1.1-dev patch
#   bump2version --new-version 2.1.1 stage      # 2.1.1-dev -> 2.1.1
# A normal patch/minor/major bump from a stable version creates another stable version:
#   bump2version patch                          # 2.1.0 -> 2.1.1
# Stage changes reset the serial to 0; use --new-version for alpha.1 etc.
#   bump2version --new-version 2.1.1-alpha.1 patch  # optional patch prerelease
#   bump2version --new-version 2.1.0-alpha.1 stage
#   bump2version serial                         # alpha.1 -> alpha.2
#   bump2version --new-version 2.1.0-beta.1 stage
#   bump2version --new-version 2.1.0-rc.1 stage
#   bump2version stage                          # rc.N -> 2.1.0
# Changelog is intentionally NOT managed here: publish only consolidated
# stable release entries (including patches), never alpha/beta/rc entries.
# Finalize and commit CHANGELOG.md before running the stable bump.
[bumpversion:part:stage]
values =
    dev
    alpha
    beta
    rc
    stable
optional_value = stable
first_value = stable

[bumpversion:part:serial]
first_value = 0

# Optional .dev suffix AFTER an alpha/beta/rc serial:
# alpha.1 < alpha.1.dev < alpha.2.
[bumpversion:part:development]
values =
    stable
    dev
optional_value = stable
first_value = stable

[bumpversion:file:conanfile.py]
search = version = "{current_version}"
replace = version = "{new_version}"

[bumpversion:file:CMakeLists.txt]
# CMake project(VERSION) accepts numeric components only.
serialize = {major}.{minor}.{patch}
search = project(GTlab-Core VERSION {current_version})
replace = project(GTlab-Core VERSION {new_version})

[bumpversion:file:docs/dev/conf.py]
search = release = "{current_version}"
replace = release = "{new_version}"

[bumpversion:file:docs/user/conf.py]
search = release = "{current_version}"
replace = release = "{new_version}"

# All version macros are replaced atomically. Separate rules for the
# numeric macros trigger bump2version's fallback for unchanged values and
# can corrupt the full version string during a prerelease dev bump.
# Use {#} for literal # to avoid ConfigParser treating serialize lines as comments.
[bumpversion:file:src/dataprocessor/gt_version.h]
serialize =
    {#}define GT_VERSION_MAJOR {major}\n{#}define GT_VERSION_MINOR {minor}\n{#}define GT_VERSION_PATCH {patch}\n{#}define GT_VERSION_STRING "{major}.{minor}.{patch}-{stage}.{serial}.{development}"
    {#}define GT_VERSION_MAJOR {major}\n{#}define GT_VERSION_MINOR {minor}\n{#}define GT_VERSION_PATCH {patch}\n{#}define GT_VERSION_STRING "{major}.{minor}.{patch}-{stage}.{serial}"
    {#}define GT_VERSION_MAJOR {major}\n{#}define GT_VERSION_MINOR {minor}\n{#}define GT_VERSION_PATCH {patch}\n{#}define GT_VERSION_STRING "{major}.{minor}.{patch}-{stage}"
    {#}define GT_VERSION_MAJOR {major}\n{#}define GT_VERSION_MINOR {minor}\n{#}define GT_VERSION_PATCH {patch}\n{#}define GT_VERSION_STRING "{major}.{minor}.{patch}"
