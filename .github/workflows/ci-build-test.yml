# Reusable workflow: regular build/test jobs (Linux + Windows) and the Qt 6 build.
#
# Called by ci.yml, see that file for the trigger configuration.

name: CI - Build and test

on:
  workflow_call:

jobs:

  build_and_test:
    name: "Build and test"
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022] # GitHub-provided Windows and Linux images
    runs-on: ${{ matrix.os }} # use value from the matrix

    steps:
    - name: Install dependencies (linux)
      if: matrix.os == 'ubuntu-latest'
      run: |
        sudo apt install -y ninja-build

        wget https://gtlab.de/builddeps/hdf5-1.12.1-linux.tar.gz
        mkdir $HOME/build_deps
        tar xf hdf5-1.12.1-linux.tar.gz -C $HOME/build_deps
        echo "HDF5_DIR=$HOME/build_deps/hdf5-1.12.1-linux/share/cmake/hdf5" >> $GITHUB_ENV

    - name: Install Ninja (windows)    # Ninja is not available in GitHub-provided images,
                                       # see https://github.com/actions/runner-images/issues/514
      run: choco install ninja         # So let's install it through Chocolatey
      if: startsWith(matrix.os, 'windows')

    - name: Install Qt
      uses: jurplel/install-qt-action@v4
      with:
        version: '5.15.2'
    - uses: ilammy/msvc-dev-cmd@v1 # This action essentially calls vcvarsall.bat for the latest VS in the runner for x64
    - uses: actions/checkout@v3    # Actually check out the sources. GH Actions can run for events that may not require
                                   # sources (e.g. when someone comments on an issue)
      with:
        persist-credentials: false
    - name: Install dependencies (windows)
      if: startsWith(matrix.os, 'windows')
      shell: powershell
      run: |
        $ProgressPreference = 'SilentlyContinue'

        Invoke-WebRequest -Uri https://gtlab.de/builddeps/hdf5-1.12.1-win64.zip -OutFile hdf5-1.12.1-win64.zip
        Expand-Archive -Path 'hdf5-1.12.1-win64.zip' -DestinationPath "$HOME/build_deps"
        "HDF5_DIR=$HOME\build_deps\hdf5-1.12.1-win64\share\cmake\hdf5" | Out-File -FilePath $env:GITHUB_ENV -Append
        "HDF5_BIN_DIR=$HOME\build_deps\hdf5-1.12.1-win64\bin" | Out-File -FilePath $env:GITHUB_ENV -Append


    # Here we call CMake manually, there are solutions for that in the Marketplace: https://github.com/marketplace/actions/run-cmake
    - name: Configure
      run: |
        python3 -m pip install -r tests/systemtests/requirements.txt
        cmake -S . -B build -G "Ninja Multi-Config" -DBUILD_UNITTESTS=ON -DBUILD_TESTMODULES=ON -DCMAKE_INSTALL_PREFIX=install

    - name: Build (Ubuntu)
      id: build
      if: matrix.os == 'ubuntu-latest'
      env:
        LC_ALL: C.UTF-8
      run: |
        set -o pipefail
        cmake --build build --target install --config=Debug 2>&1 | tee "$RUNNER_TEMP/ubuntu-build.log"

    - name: Build (Windows)
      if: startsWith(matrix.os, 'windows')
      run: cmake --build build --target install --config=Debug

    # Reporting errors are enforced at the end, so they do not suppress tests.
    - name: Capture compiler warnings
      id: warnings
      if: always() && matrix.os == 'ubuntu-latest' && steps.build.outcome != 'skipped' && steps.build.outcome != ''
      continue-on-error: true
      env:
        LC_ALL: C.UTF-8
        WARNING_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
      run: |
        source /etc/os-release
        python3 .github/scripts/compiler_warnings.py analyze \
          --log "$RUNNER_TEMP/ubuntu-build.log" --root "$GITHUB_WORKSPACE" \
          --revision "$WARNING_REVISION" --compiler "$(c++ --version | sed -n '1p')" \
          --platform "${ID}-${VERSION_ID}" \
          --build-succeeded "${{ steps.build.outcome == 'success' }}" \
          --output "$RUNNER_TEMP/compiler-warnings.json"
        if [[ "$GITHUB_EVENT_NAME" != 'pull_request' ]]; then
          python3 .github/scripts/compiler_warnings.py summary \
            --current "$RUNNER_TEMP/compiler-warnings.json" --summary "$RUNNER_TEMP/warning-summary.md"
          cat "$RUNNER_TEMP/warning-summary.md" >> "$GITHUB_STEP_SUMMARY"
        fi

    - name: Upload compiler warning report
      id: warning_artifact
      if: always() && matrix.os == 'ubuntu-latest' && steps.warnings.outcome == 'success'
      continue-on-error: true
      uses: actions/upload-artifact@v4
      with:
        name: compiler-warnings-ubuntu
        path: ${{ runner.temp }}/compiler-warnings.json
        if-no-files-found: error
        retention-days: 60

    - name: Build external module consumer (Linux)
      if: matrix.os == 'ubuntu-latest'
      run: |
        cmake -S tests/modules/module_abi/external_consumer -B build/external-consumer -DCMAKE_BUILD_TYPE=Debug -DCMAKE_PREFIX_PATH="$GITHUB_WORKSPACE/install" -DCMAKE_INSTALL_PREFIX="$GITHUB_WORKSPACE/install" -DCMAKE_INSTALL_BINDIR=consumer-bin -DCMAKE_INSTALL_LIBDIR=consumer-lib -Dhdf5_DIR="$HDF5_DIR"
        cmake --build build/external-consumer --target install --config Debug
        cmake -E chdir build/external-consumer ctest -C Debug -R ExternalModuleInstallLayout --output-on-failure

    - name: Build external module consumer (Windows)
      if: startsWith(matrix.os, 'windows')
      run: |
        cmake -S tests/modules/module_abi/external_consumer -B build/external-consumer "-DCMAKE_PREFIX_PATH=$env:GITHUB_WORKSPACE\install" "-DCMAKE_INSTALL_PREFIX=$env:GITHUB_WORKSPACE\install" -DCMAKE_INSTALL_BINDIR=consumer-bin -DCMAKE_INSTALL_LIBDIR=consumer-lib "-Dhdf5_DIR=$env:HDF5_DIR"
        cmake --build build/external-consumer --target install --config Debug
        cmake -E chdir build/external-consumer ctest -C Debug -R ExternalModuleInstallLayout --output-on-failure

    - name: Unit Tests - Windows
      if: startsWith(matrix.os, 'windows')
      shell: cmd /C call {0}
      run: |
        set PATH=%cd%\install\binDebug;%HDF5_BIN_DIR%;%PATH%
        cd build
        .\GTlabUnitTest.exe --gtest_output=xml:unittests.xml

    - name: Unit Tests - Linux
      if: matrix.os == 'ubuntu-latest'
      run: |
        cd build
        ./GTlabUnitTest --gtest_output=xml:unittests.xml

    - name: System Tests - Linux
      if: matrix.os == 'ubuntu-latest'
      run: |
        ctest --test-dir build -C Debug -L SystemTest --output-on-failure

    - name: System Test - Module ABI (Windows)
      if: startsWith(matrix.os, 'windows')
      shell: cmd /C call {0}
      run: |
        set PATH=%cd%\install\binDebug;%HDF5_BIN_DIR%;%PATH%
        ctest --test-dir build -C Debug -R SystemTest.ModuleAbiCompatibility --output-on-failure

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: Binaries - ${{ matrix.os }}
        path: |
          install
          build/*.so*
          build/**/*.dll
          build/**/*.exe
          build/**/*.lib
          build/**/*.pdb
          build/GTlab*
          build/modules
          build/**/*.txt
          build/**/*.cmake
          build/**/*.ninja
          build/**/*.log
          build/_deps/*-src

    - name: Compare compiler warnings with target branch
      id: warning_comparison
      if: always() && !cancelled() && matrix.os == 'ubuntu-latest' && steps.warnings.outcome == 'success' && github.event_name == 'pull_request'
      continue-on-error: true
      env:
        GITHUB_TOKEN: ${{ github.token }} # Read-only, also for same-repository PRs.
        PR_TARGET: ${{ github.event.pull_request.base.ref }}
        PR_HEAD: ${{ github.event.pull_request.head.sha }}
      run: |
        status=0
        python3 .github/scripts/compiler_warnings.py compare \
          --current "$RUNNER_TEMP/compiler-warnings.json" \
          --repository "$GITHUB_REPOSITORY" \
          --target-branch "$PR_TARGET" --head-revision "$PR_HEAD" \
          --summary "$RUNNER_TEMP/warning-summary.md" \
          --checkstyle "$RUNNER_TEMP/new-warnings.xml" || status=$?
        if [[ -f "$RUNNER_TEMP/warning-summary.md" ]]; then
          cat "$RUNNER_TEMP/warning-summary.md" >> "$GITHUB_STEP_SUMMARY"
        fi
        exit "$status"

    - name: Set up reviewdog
      if: always() && !cancelled() && matrix.os == 'ubuntu-latest' && steps.warning_comparison.outputs.new_warnings != '' && steps.warning_comparison.outputs.new_warnings != '0'
      uses: reviewdog/action-setup@d8a7baabd7f3e8544ee4dbde3ee41d0011c3a93f # v1
      continue-on-error: true
      with:
        reviewdog_version: v0.21.2

    # Local Actions annotations work on forks and do not require write access.
    - name: Annotate new compiler warnings
      if: always() && !cancelled() && matrix.os == 'ubuntu-latest' && steps.warning_comparison.outputs.new_warnings != '' && steps.warning_comparison.outputs.new_warnings != '0'
      continue-on-error: true
      env:
        REVIEWDOG_GITHUB_API_TOKEN: ${{ github.token }} # Used only to read the diff.
      run: |
        reviewdog -f=checkstyle -name=compiler-warnings -reporter=github-annotations -filter-mode=nofilter -level=warning \
          < "$RUNNER_TEMP/new-warnings.xml"

    - name: Enforce compiler warning check
      if: always() && matrix.os == 'ubuntu-latest' && (steps.warnings.outcome == 'failure' || steps.warning_artifact.outcome == 'failure' || steps.warning_comparison.outcome == 'failure')
      run: |
        echo '::error::Compiler warning analysis, report upload or comparison failed. See the step logs and summary.'
        exit 1

  build_win_qt6:
    name: "Build with qt6 on windows"
    runs-on: windows-2022

    steps:
    - name: Install Ninja (windows)
      run: choco install ninja

    - name: Install Qt
      uses: jurplel/install-qt-action@v4
      with:
        version: '6.5.3'
        modules: 'qt5compat qtshadertools'

    - uses: ilammy/msvc-dev-cmd@v1
    - uses: actions/checkout@v3

    - name: Install dependencies (windows)
      shell: powershell
      run: |
        $ProgressPreference = 'SilentlyContinue'

        Invoke-WebRequest -Uri https://gtlab.de/builddeps/hdf5-1.12.1-win64.zip -OutFile hdf5-1.12.1-win64.zip
        Expand-Archive -Path 'hdf5-1.12.1-win64.zip' -DestinationPath "$HOME/build_deps"
        "HDF5_DIR=$HOME\build_deps\hdf5-1.12.1-win64\share\cmake\hdf5" | Out-File -FilePath $env:GITHUB_ENV -Append
        "HDF5_BIN_DIR=$HOME\build_deps\hdf5-1.12.1-win64\bin" | Out-File -FilePath $env:GITHUB_ENV -Append

    - name: Build
      run: |
        cmake -S . -B build -G "Ninja Multi-Config" -DBUILD_UNITTESTS=ON -DBUILD_TESTMODULES=ON -DCMAKE_INSTALL_PREFIX=gtlab-win64-qt6
        cmake --build build --target install --config=Release

    - name: Unit Tests - Windows
      shell: cmd /C call {0}
      run: |
        set PATH=%cd%\build\install\bin;%HDF5_BIN_DIR%;%PATH%
        cd build
        .\GTlabUnitTest.exe --gtest_output=xml:unittests.xml

    - name: Create Package (Windows)
      run: |
        cd gtlab-win64-qt6/bin
        windeployqt.exe --qmldir ..\..\src\resources\qml --plugindir qtplugins --no-translations --qml-deploy-dir qml -printsupport -core5compat GTlab.exe
        cp $env:HDF5_BIN_DIR/hdf5.dll .

        # Create qt.conf file
        @"
        [Paths]
        Prefix = ./
        Plugins = qtplugins
        Imports = qml
        Qml2Imports = qml
        "@ | Out-File -Encoding UTF8 qt.conf

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: GTlab Windows Qt6.5
        path: |
          gtlab-win64-qt6
