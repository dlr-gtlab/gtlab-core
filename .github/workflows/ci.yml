# CI entry point for pushes and pull requests.
#
# The jobs themselves live in reusable workflows, grouped by concern:
#   - ci-build-test.yml : regular build/test jobs + Qt 6 build
#   - ci-quality.yml    : cppcheck, license compliance, coverage
#   - ci-docs.yml       : developer and user documentation
#
# The Squish GUI tests are executed in the internal GitLab CI. Their results are
# published to GitHub by publish-gui-tests.yml, which is triggered by the GitLab
# commit status and therefore not part of this workflow.

name: CI

on:
  push:
    branches: [ "master", "2.0.X" ]
  pull_request:
    branches: [ "master", "2.0.X" ]

jobs:

  build:
    name: "Build"
    uses: ./.github/workflows/ci-build-test.yml
    secrets: inherit

  quality:
    name: "Quality"
    uses: ./.github/workflows/ci-quality.yml
    secrets: inherit

  docs:
    name: "Docs"
    uses: ./.github/workflows/ci-docs.yml
    secrets: inherit
