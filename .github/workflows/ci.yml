# CI entry point for pushes and pull requests.
#
# The jobs themselves live in reusable workflows, grouped by concern:
#   - ci-build-test.yml : regular build/test jobs + Qt 6 build
#   - ci-quality.yml    : cppcheck, license compliance, coverage
#   - ci-docs.yml       : developer and user documentation
#
# The Squish GUI tests are executed in the internal GitLab CI. Their results are
# published to GitHub by publish-gui-tests.yml, which is triggered by the GitLab
# commit status and therefore not part of this workflow.

name: CI

on:
  push:
    branches: [ "master", "2.0.X" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "master", "2.0.X" ]

jobs:

  release-versioning:
    name: "Release versioning"
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install bump2version==1.0.1
      - run: python -m unittest discover -s tests/release -p "test_*.py"
      - run: python -m unittest discover -s .github/scripts -p "test_*.py"

  build:
    name: "Build"
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/ci-build-test.yml

  quality:
    name: "Quality"
    concurrency:
      group: quality-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    # Jobs of a reusable workflow may only use the permissions granted by the
    # calling job. Cppcheck uploads SARIF results, and the header include
    # linter reports annotations, so their write permissions are granted here.
    permissions:
      contents: read
      security-events: write
      checks: write
      pull-requests: write
    uses: ./.github/workflows/ci-quality.yml
    secrets: inherit

  docs:
    name: "Docs"
    uses: ./.github/workflows/ci-docs.yml
    secrets: inherit
