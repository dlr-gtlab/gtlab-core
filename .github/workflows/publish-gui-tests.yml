# Publish the Squish GUI test results that are produced by the internal GitLab CI.
#
# The GUI tests keep running on the GitLab runners - GitHub is only the public
# presentation layer. The GitLab integration already reports the pipeline state
# of the mirrored repository as commit status "ci/gitlab/gitlab.dlr.de", so this
# workflow reacts to that existing signal instead of polling GitLab or adding a
# self-hosted runner:
#
#   1. wait until the GitLab commit status reaches a terminal state (triggered)
#   2. resolve the pipeline of the status "target_url" and its "guiTests" job
#   3. download the artifacts of exactly that job (also for failed runs)
#   4. republish them as GitHub Actions artifacts and a job summary
#   5. publish the latest default-branch Squish HTML report and badge via Pages
#
# Guards:
#   - the status "target_url" is untrusted input and its host decides where
#     GITLAB_TOKEN is sent to, so only "https://gitlab.dlr.de" plus the mirror
#     project of this repository are accepted (rejected before any request)
#   - the resolved pipeline must belong to the commit of the status
#   - executed tests whose artifacts/JUnit report are missing fail the job as a
#     publishing error, while runs without executed tests stay neutral
#
# Requires the "GITLAB_TOKEN" secret: a GitLab API token with "read_api" scope
# for the GitLab project that mirrors this repository.
#
# Like all "status" triggered workflows, this file is only picked up from the
# default branch. "workflow_dispatch" exists to re-publish the results of an
# older pipeline without touching GitLab.

name: GUI Tests

on:
  status:
  workflow_dispatch:
    inputs:
      pipeline_url:
        description: "GitLab pipeline url, e.g. https://gitlab.dlr.de/gtlab/internal/github-mirrors/gtlab-core-mirror/-/pipelines/<id>"
        required: true
        type: string

jobs:

  publish:
    name: "Publish GUI tests"
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # Only react to the GitLab pipeline status, and only once it is final:
    # "pending" would mean the GUI tests are still running in GitLab. The
    # context lives in "name" (and "context") depending on the event payload.
    if: >-
      github.event_name != 'status' ||
      ((github.event.name == 'ci/gitlab/gitlab.dlr.de' ||
        github.event.context == 'ci/gitlab/gitlab.dlr.de') &&
      github.event.state != 'pending')

    permissions:
      contents: read

    outputs:
      has_results: ${{ steps.download.outputs.has_results }}

    env:
      GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
      GITLAB_GUI_TESTS_JOB: guiTests
      # Note: "RESULTS_DIR" is defined per step, the "runner" context is not
      # available in the job level "env" block.

    steps:
    - name: Checkout helper scripts
      uses: actions/checkout@v4

    - name: Resolve GitLab pipeline and GUI test job
      id: resolve
      env:
        STATUS_TARGET_URL: ${{ github.event.inputs.pipeline_url || github.event.target_url }}
        STATUS_STATE: ${{ github.event.state }}
        STATUS_SHA: ${{ github.event.sha }}
      run: python3 .github/scripts/gitlab_guitests.py resolve

    - name: Download artifacts of that GitLab job
      id: download
      env:
        API_BASE: ${{ steps.resolve.outputs.api_base }}
        PROJECT: ${{ steps.resolve.outputs.project }}
        JOB_ID: ${{ steps.resolve.outputs.job_id }}
        RESULTS_DIR: ${{ runner.temp }}/gui_tests
      run: |
        python3 .github/scripts/gitlab_guitests.py download \
          --api-base "$API_BASE" \
          --project "$PROJECT" \
          --job-id "$JOB_ID" \
          --dest "$RESULTS_DIR"

    - name: Upload Squish web report
      if: always() && steps.download.outputs.has_results == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: gui_tests_web
        path: ${{ runner.temp }}/gui_tests/gui_tests_web

    - name: Upload Squish JUnit reports
      if: always() && steps.download.outputs.has_results == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: gui_tests_junits
        path: ${{ runner.temp }}/gui_tests/gui_tests_junits

    - name: Upload Squish test output
      if: always() && steps.download.outputs.has_results == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: gui_tests_stdout
        path: ${{ runner.temp }}/gui_tests/gui_tests_stdout*.txt

    - name: Upload Squish server output
      if: always() && steps.download.outputs.has_results == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: gui_tests_server_stdout
        path: ${{ runner.temp }}/gui_tests/gui_tests_server_stdout.txt

    - name: Upload GUI tests badge
      if: always() && steps.download.outputs.has_results == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: guitests_badge
        path: ${{ runner.temp }}/gui_tests/guitests_badge.svg

    - name: Summarize the JUnit results
      id: summary
      if: always() && steps.resolve.outcome == 'success'
      env:
        RESULTS_DIR: ${{ runner.temp }}/gui_tests
        RESULT: ${{ steps.resolve.outputs.result }}
        REASON: ${{ steps.resolve.outputs.reason }}
        JOB_URL: ${{ steps.resolve.outputs.job_url }}
        PIPELINE_URL: ${{ steps.resolve.outputs.pipeline_url }}
        HAS_RESULTS: ${{ steps.download.outputs.has_results }}
      run: |
        python3 .github/scripts/gitlab_guitests.py summary \
          --dir "$RESULTS_DIR" \
          --result "$RESULT" \
          --reason "$REASON" \
          --job-url "$JOB_URL" \
          --pipeline-url "$PIPELINE_URL" \
          --has-results "$HAS_RESULTS"

    - name: Report GUI test result
      if: always() && steps.resolve.outcome == 'success'
      env:
        RESULT: ${{ steps.summary.outputs.result || steps.resolve.outputs.result }}
        REASON: ${{ steps.resolve.outputs.reason }}
        PUBLISH_ERROR: ${{ steps.summary.outputs.publish_error }}
        STATE: ${{ github.event.state }}
        JOB_URL: ${{ steps.resolve.outputs.job_url }}
        PIPELINE_URL: ${{ steps.resolve.outputs.pipeline_url }}
      run: |
        case "$RESULT" in
          passed)
            echo "Squish GUI tests passed."
            ;;
          failed)
            echo "::error::Squish GUI tests failed. See $JOB_URL"
            exit 1
            ;;
          not_executed)
            message="Squish GUI tests were not executed ($REASON). "
            message+="The GitLab pipeline state is authoritative: $PIPELINE_URL"
            if [ "$STATE" = "success" ]; then
              echo "::notice::$message"
            else
              echo "::warning::$message"
            fi
            ;;
          publish_error)
            # the tests ran but their report never arrived: never green, and
            # never blamed on the Squish tests either
            message="${PUBLISH_ERROR:-The executed GitLab GUI test job published no artifacts.}"
            details="GUI test results could not be published "
            details+="(infrastructure problem, not a Squish test failure): "
            echo "::error::$details$message"
            echo "GitLab job: $JOB_URL"
            echo "GitLab pipeline: $PIPELINE_URL"
            exit 1
            ;;
          *)
            echo "::error::Could not determine the GUI test result ('$RESULT')."
            exit 1
            ;;
        esac


  pages:
    name: "Prepare GUI test report for Pages"
    needs: publish
    if: >-
      always() &&
      needs.publish.outputs.has_results == 'true' &&
      (github.event_name == 'workflow_dispatch' ||
       contains(github.event.branches.*.name, github.event.repository.default_branch))
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - name: Download Squish web report
      uses: actions/download-artifact@v4
      with:
        name: gui_tests_web
        path: ${{ runner.temp }}/pages

    - name: Download GUI tests badge
      uses: actions/download-artifact@v4
      with:
        name: guitests_badge
        path: ${{ runner.temp }}/pages

    - name: Prepare static site
      run: touch "${{ runner.temp }}/pages/.nojekyll"

    - name: Configure GitHub Pages
      uses: actions/configure-pages@v5

    - name: Upload GitHub Pages artifact
      uses: actions/upload-pages-artifact@v4
      with:
        path: ${{ runner.temp }}/pages

  deploy:
    name: "Deploy GUI test report"
    needs: pages
    if: always() && needs.pages.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4
